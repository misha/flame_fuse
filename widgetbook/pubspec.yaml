name: flame_fuse_widgetbook
description: Widgetbook for the flame_fuse package.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.11.1"
  flutter: ">=3.41.4"
dependencies:
  flame: ^1.36.0
  flame_fuse:
    path: ../
  flutter:
    sdk: flutter
  url_launcher: ^6.3.2
  widgetbook: ^3.20.2
  widgetbook_annotation: ^3.9.0
dev_dependencies:
  build_runner: ^2.12.2
  flame_lint: ^1.4.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  widgetbook_generator: ^3.20.1
flutter:
  uses-material-design: true
scripts:
  build: dart run build_runner build --delete-conflicting-outputs
  watch: dart run build_runner watch --delete-conflicting-outputs
